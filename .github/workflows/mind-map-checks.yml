name: Mind Map Integration Checks

on:
  pull_request:
    branches: [fix/quiz-dashboard-reliability, main, master]
  push:
    branches: [feature/interactive-mind-map]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Emit resolved lockfile temporarily
        run: |
          python - <<'PY'
          import base64
          data = base64.b64encode(open("package-lock.json", "rb").read()).decode()
          for index in range(0, len(data), 3000):
              print(f"LOCK_CHUNK_{index // 3000:03d}:" + data[index:index + 3000])
          PY
      - run: npm run build

  backend-mind-map-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_mind_map*.py" -v
